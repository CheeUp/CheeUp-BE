services:
  cheeup-db:
    image: postgres:15
    restart: always
    volumes:
      - ./db/master/initdb.d:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: cheeup
      POSTGRES_PASSWORD: cheeup
      POSTGRES_DB: cheeup
  redis:
    image: redis:alpine
    restart: always
    #    volumes:
    #      - ./redis/data:/data
    ports:
      - "6379:6379"
#    command: redis-server --appendonly yes --appendfsync everysec
